[project]
name = "efraim"
version = "0.1.0"
description = "Agente de pesquisa de precos e fornecedores (moshe1.8)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]  # gerado por `alembic revision --autogenerate`

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]
