services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: efraim
      POSTGRES_PASSWORD: efraim
      POSTGRES_DB: efraim
    ports:
      - "5432:5432"
    volumes:
      - efraim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efraim"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  efraim_pg:
