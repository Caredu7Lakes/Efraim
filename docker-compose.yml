services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: efraim
      POSTGRES_PASSWORD: efraim
      POSTGRES_DB: efraim
    ports:
      - "5432:5432"
    volumes:
      - efraim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efraim"]
      interval: 5s
      timeout: 3s
      retries: 5

  # broker + result backend do Celery (fila real, substitui o runner
  # in-process de v1 — ver backend/app/jobs/celery_app.py)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  efraim_pg:
